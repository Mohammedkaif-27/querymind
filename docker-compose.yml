services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: querymind_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - ./embeddings/chroma_db:/app/embeddings/chroma_db
      - ./data:/app/data

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: querymind_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
